name: ArchiveXL Cyberpunk 2.5 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Cyberpunk 2.5 RED4ext SDK with class layouts
        shell: pwsh
        run: |
          git -C vendor/RED4ext.SDK fetch --depth=1 https://github.com/KelpHect/RED4ext.SDK-psiberx.git patch-2.5-layouts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -C vendor/RED4ext.SDK checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdkCommit = git -C vendor/RED4ext.SDK rev-parse HEAD
          if ($sdkCommit -ne 'b139fcbd51b1c391399662f9fbfc00c5977f7231') {
            throw "Unexpected SDK commit: $sdkCommit"
          }
          Write-Host "SDK commit: $sdkCommit"

          $callback = Get-Content vendor/RED4ext.SDK/include/RED4ext/Callback.hpp -Raw
          if ($callback -notmatch 'DefaultFixedCallbackBufferSize\s*=\s*64') {
            throw "SDK does not contain the Cyberpunk 2.5 callback layout"
          }

          $vehicle = Get-Content vendor/RED4ext.SDK/include/RED4ext/Scripting/Natives/Generated/vehicle/BaseObject.hpp -Raw
          if ($vehicle -notmatch 'RED4EXT_ASSERT_SIZE\(vehicle::BaseObject, 0xBC0\)') {
            throw "SDK does not contain the Cyberpunk 2.5 class layouts"
          }

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure Release build
        run: xmake f -p windows -a x64 -m release -y

      - name: Build ArchiveXL
        run: xmake -vD -y

      - name: Upload compiled DLL and PDB
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveXL-Cyberpunk-2.5-layouts-test
          path: |
            build/**/ArchiveXL.dll
            build/**/ArchiveXL.pdb
          if-no-files-found: error
